# seed-release-tools — keep install-release-tool's cache warm on the default
# branch, where every branch's runs can read it.
#
# Copy to .github/workflows/seed-release-tools.yml in a repository that calls
# boonty-io/.github/.github/actions/install-release-tool, then:
#   - list in `matrix.runner` every runner label an install job uses
#     (GitHub-hosted and Blacksmith runners keep separate caches);
#   - add one install step per tool, with the SAME version, url and sha256 as
#     the workflow that installs it;
# A seeder that pins something else seeds a key no install reads. The drift
# check reads this file's own url and sha256 inputs and fails unless each one
# appears verbatim in another workflow, which turns that mistake into a red
# scheduled run instead of a silent cache miss. It cannot tell which other
# workflow should carry a pin: it checks presence, not the pairing.
# test/seed-release-tools-template.test.sh runs the check against fixtures.
#
# Why it exists: docs/release-tool-cache.md.
name: seed-release-tools

on:
  schedule:
    - cron: '17 4 * * *' # daily: an entry unused for 7 days is evicted
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    name: seed (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Seeded pins match the workflows that install them
        # Reads this file's own `url:` and `sha256:` inputs, so there is no
        # second list to keep in step. The cache key is name, version and
        # sha256, and the url carries the version.
        run: |
          set -euo pipefail
          self=.github/workflows/seed-release-tools.yml
          mapfile -t pins < <(sed -nE "s/^[[:space:]]+(url|sha256):[[:space:]]*'?([^' #]+)'?.*/\2/p" "$self")
          [ "${#pins[@]}" -gt 0 ] || { echo "::error::no url or sha256 input found in $self"; exit 1; }
          others=()
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] && [ "$f" != "$self" ] && others+=("$f")
          done
          for pin in "${pins[@]}"; do
            grep -qF -- "$pin" "${others[@]}" /dev/null || {
              echo "::error::$pin, seeded by $self, is in no other workflow: this seeds a key no install reads"
              exit 1
            }
          done
      - uses: boonty-io/.github/.github/actions/install-release-tool@<sha> # main
        with:
          name: actionlint
          version: 1.7.12
          url: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
