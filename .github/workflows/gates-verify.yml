# gates-verify — post the `gates/verified` commit status on a pull request head.
#
# Reusable (`workflow_call`). A consumer calls it from a short
# `.github/workflows/gates-verify.yml` (docs/merge-by-github.md):
#
#   pull_request_target / opened, reopened, synchronize, ready_for_review, edited
#   issue_comment / created, edited   (only a comment starting with the marker)
#   merge_group / checks_requested     (a merge-queue entry)
#
# The status is `success` when the last-written gate receipt comment (posted by
# `boonty-ai gate publish`) from someone with write access shows the four
# Phase 5 gates passing against the PR's current base for the SAME diff as the
# head: scripts/gate-content-hash.sh over merge-base..head. A rebase onto a
# base that touched none of the diff's files keeps the verdict without
# re-running any gate, so a required `gates/verified` plus the merge queue
# lets GitHub land the PR once the `ci/*` checks are green, with no session in
# the loop (docs/merge-queue.md).
#
# In a merge queue, GitHub tests a commit of its own (base + the entries ahead
# + this PR) and wants every required context on THAT sha. The `target` job
# names the queued PR from the queue ref (scripts/merge-group-target.sh); the
# same decision then runs against that PR's receipt and current head, and the
# status goes on the merge-group sha. There, "no receipt" is a failure, not
# pending: a pending context would hold the queue until its timeout. An entry
# whose ref names no PR gets a failure too.
#
# Every trigger run the caller from the default branch, never from the PR, so
# a PR cannot change this workflow's decision (it could still add a workflow of
# its own that posts the context: docs/merge-by-github.md, "Trust"). The PR head is checked out only
# to take its diff and, for an ai-config bump PR, to read its three package files as data;
# nothing from it is executed. An ai-config bump PR is reproduced in the `bump`
# job, whose token cannot post a status; `verify` alone holds statuses: write. The decision is
# `scripts/gates-verify.sh` (tested by `test/gates-verify.test.sh`). The status
# is posted with github.token, so GitHub attributes it to GitHub Actions
# (integration 15368), and the ruleset pins the context to that App.
name: gates-verify

on:
  workflow_call:
    inputs:
      shared_ref:
        description: Deprecated. The workflow checks out its own commit (`job.workflow_sha`) and reads this only when that property is empty. Still declared so callers on `@main` that pass it keep validating. Do not pass it with a SHA pin, because on-demand-guard counts it as a ref.
        required: false
        default: main
        type: string

permissions: {}

jobs:
  # Which PR this run is about, and which sha its status goes on: the PR head
  # for a PR event, the merge-group commit for a queue entry.
  target:
    name: target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read        # the parser script
    outputs:
      pr: ${{ steps.t.outputs.pr }}
      queue: ${{ steps.t.outputs.queue }}
      queue_sha: ${{ steps.t.outputs.queue_sha }}
    steps:
      - name: Check out the parser
        if: github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: boonty-io/.github
          ref: ${{ job.workflow_sha || inputs.shared_ref }}
          path: shared
          sparse-checkout: |
            scripts/merge-group-target.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Name the pull request
        id: t
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          IS_PR: ${{ github.event_name == 'pull_request_target' || github.event.issue.pull_request != null }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          QUEUE_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = merge_group ]; then
            [[ "$QUEUE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error title=gates-verify::merge_group event without a head_sha"; exit 1; }
            { echo "queue=true"; echo "queue_sha=$QUEUE_SHA"; } >> "$GITHUB_OUTPUT"
            if out="$(shared/scripts/merge-group-target.sh "$HEAD_REF" "$BASE_REF")"; then
              printf '%s\n' "$out" | grep '^pr=' >> "$GITHUB_OUTPUT"
            else
              echo "::error title=gates-verify::'$HEAD_REF' names no queued pull request on '$BASE_REF'"
            fi
          else
            echo "queue=false" >> "$GITHUB_OUTPUT"
            if [ "$IS_PR" = true ] && [ -n "$PR" ]; then echo "pr=$PR" >> "$GITHUB_OUTPUT"; fi
          fi

  # The published `boonty-ai sync` runs in this job, on its own runner. Its
  # token has no statuses: write, so nothing that runs inside `sync` (a
  # process it leaves behind included) can post gates/verified.
  bump:
    name: bump
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read        # the PR head, to read its three package files
      pull-requests: read   # gh pr view
      packages: read        # @boonty-io/ai-config, to reproduce a bump PR
    outputs:
      head: ${{ steps.reproduce.outputs.head }}
      bump_ok: ${{ steps.reproduce.outputs.bump_ok }}
    steps:
      - name: Resolve an ai-config bump PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.target.outputs.pr }}
        run: |
          set -euo pipefail
          [ -n "$PR" ] || exit 0
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,title,headRefName,headRefOid,baseRefName,isCrossRepository > pr.json
          # The dispatch shape: the title and branch name one version, the
          # head is not a fork. verify re-checks it on its own facts.
          version="$(jq -r 'select(.state == "OPEN" and .isCrossRepository == false)
            | (.title | capture("\\Achore\\(deps\\): bump @boonty-io/ai-config to v(?<v>[0-9]+\\.[0-9]+\\.[0-9]+)\\z").v) as $v
            | select(.headRefName == ("chore/bump-ai-config-v" + $v)) | $v' pr.json 2>/dev/null || true)"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            {
              echo "version=$version"
              echo "head=$(jq -r .headRefOid pr.json)"
              echo "base=$(jq -r .baseRefName pr.json)"
            } >> "$GITHUB_OUTPUT"
          elif jq -e '.title | test("bump @boonty-io/ai-config")' pr.json >/dev/null 2>&1; then
            echo "::notice title=gates-verify::the title names an ai-config bump but the title, branch or fork check refused it; no bump exemption"
          fi

      - name: Warn when this workflow cannot see its own commit
        if: steps.pr.outputs.version != '' && job.workflow_sha == ''
        env:
          SHARED_REF: ${{ inputs.shared_ref }}
        run: echo "::warning::job.workflow_sha is empty, so boonty-io/.github is checked out at '${SHARED_REF:-the default branch}', not at this workflow's own commit"

      - name: Check out the bump scripts
        if: steps.pr.outputs.version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: boonty-io/.github
          ref: ${{ job.workflow_sha || inputs.shared_ref }}
          path: shared
          sparse-checkout: |
            scripts/bump-reproduces.sh
            scripts/bump-normalize.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the PR head (read only, nothing from it runs)
        if: steps.pr.outputs.version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      # NPM_TOKEN is this job's token (packages read, no statuses: write). It
      # is in this step's environment and in a temp userconfig, which
      # scripts/bump-reproduces.sh deletes before `sync` starts under env -i.
      - name: Reproduce the bump
        id: reproduce
        if: steps.pr.outputs.version != ''
        env:
          NPM_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          BASE: ${{ steps.pr.outputs.base }}
          VERSION: ${{ steps.pr.outputs.version }}
        run: |
          set -uo pipefail
          [ -x shared/scripts/bump-reproduces.sh ] || { echo "::error title=gates-verify::scripts/bump-reproduces.sh missing from the sparse checkout"; exit 1; }
          npmrc="$RUNNER_TEMP/bump.npmrc"
          ( umask 077; printf '@boonty-io:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NPM_TOKEN" > "$npmrc" )
          bump_ok=false
          if shared/scripts/bump-reproduces.sh head "origin/$BASE" "$HEAD_SHA" "$VERSION" "$npmrc"; then bump_ok=true; fi
          rm -f "$npmrc"
          { echo "head=$HEAD_SHA"; echo "bump_ok=$bump_ok"; } >> "$GITHUB_OUTPUT"

  verify:
    name: verify
    needs: [target, bump]
    # A failed bump job must not leave the head without a status.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read        # the PR head, to hash its diff
      pull-requests: read   # gh pr view, the PR's comments
      statuses: write       # gates/verified
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.target.outputs.pr }}
          QUEUE: ${{ needs.target.outputs.queue }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            if [ "$QUEUE" = true ]; then
              # Post a failure on the entry rather than nothing: the queue
              # would otherwise wait for its timeout.
              echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::notice title=gates-verify::not a pull request — nothing to verify"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,baseRefName,state > pr.json
          if [ "$(jq -r .state pr.json)" != OPEN ]; then
            echo "::notice title=gates-verify::PR #$PR is not open"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "skip=false"
            echo "pr=$PR"
            echo "head=$(jq -r .headRefOid pr.json)"
            echo "base=$(jq -r .baseRefName pr.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Warn when this workflow cannot see its own commit
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.head != '' && job.workflow_sha == ''
        env:
          SHARED_REF: ${{ inputs.shared_ref }}
        run: echo "::warning::job.workflow_sha is empty, so boonty-io/.github is checked out at '${SHARED_REF:-the default branch}', not at this workflow's own commit"

      - name: Check out the decision script
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.head != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: boonty-io/.github
          ref: ${{ job.workflow_sha || inputs.shared_ref }}
          path: shared
          sparse-checkout: |
            scripts/gates-verify.sh
            scripts/gates-verify-facts.sh
            scripts/lean-diff-ok.sh
            scripts/gate-content-hash.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the PR head (read only, nothing from it runs)
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.head != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Decide
        id: decide
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          BASE: ${{ steps.pr.outputs.base }}
          # The bump job's verdict counts only for the head this job verifies.
          BUMP_OK: ${{ needs.bump.outputs.bump_ok == 'true' && needs.bump.outputs.head == steps.pr.outputs.head && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # The same hash `boonty-ai gate publish` stores as content_sha256.
          # Empty when it cannot be taken, which the decision turns into a
          # failure, never a pass.
          content="$(shared/scripts/gate-content-hash.sh head "origin/$BASE" "$HEAD_SHA")" || content=""
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[]' | jq -s . > comments.json
          # Receipt authors who can push to this repository. author_association
          # is not enough: MEMBER is any org member, COLLABORATOR may be read-only.
          : > writers.txt
          jq -r '.[] | select((.body // "") | startswith("boonty-gates/v1")) | .user.login' comments.json | sort -u |
            while IFS= read -r login; do
              [[ "$login" =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || continue
              perm="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$login/permission" --jq .permission 2>/dev/null)" || {
                echo "::warning title=gates-verify::could not read ${login}'s permission; their receipt is not trusted on this run"
                continue
              }
              case "$perm" in admin|maintain|write) echo "$login" >> writers.txt ;; esac
            done
          # Facts for the learnings exemption, read off the API and tied to
          # this head (scripts/gates-verify-facts.sh): empty on any failed
          # read or a moved head, which grants no exemption.
          facts="$(shared/scripts/gates-verify-facts.sh "$GITHUB_REPOSITORY" "$PR" "$HEAD_SHA" facts.json)" || facts=""
          # The server's own docs-only measure, for a lean receipt: true only
          # on exit 0 of scripts/lean-diff-ok.sh, false on anything else.
          [ -x shared/scripts/lean-diff-ok.sh ] || { echo "::error title=gates-verify::scripts/lean-diff-ok.sh missing from the sparse checkout"; exit 1; }
          docs_only=false
          if shared/scripts/lean-diff-ok.sh head "origin/$BASE" "$HEAD_SHA"; then docs_only=true; fi
          shared/scripts/gates-verify.sh comments.json writers.txt "$BASE" "$content" "$facts" "$docs_only" "$BUMP_OK" | tee -a "$GITHUB_OUTPUT"

      # !cancelled(): a Decide step that errors must not leave an earlier
      # `success` standing on this head; a run superseded by a newer one posts
      # nothing, so it cannot race that run's verdict.
      # In the queue the status goes on the merge-group commit, never on the
      # PR head, and a pending verdict becomes a failure (see the header).
      - name: Post gates/verified
        if: ${{ !cancelled() && steps.pr.outputs.skip == 'false' && (steps.pr.outputs.head != '' || needs.target.outputs.queue == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE: ${{ needs.target.outputs.queue }}
          QUEUE_SHA: ${{ needs.target.outputs.queue_sha }}
          PR: ${{ needs.target.outputs.pr }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          STATE: ${{ steps.decide.outputs.state || 'failure' }}
          DESCRIPTION: ${{ steps.decide.outputs.description || (needs.target.outputs.pr == '' && 'merge queue - the queue ref names no pull request' || 'gates-verify could not decide; see the run') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          sha="$HEAD_SHA"
          if [ "$QUEUE" = true ]; then
            sha="$QUEUE_SHA"
            if [ "$STATE" = pending ]; then STATE=failure; fi
            [ -z "$PR" ] || DESCRIPTION="#$PR: $DESCRIPTION"
            DESCRIPTION="${DESCRIPTION:0:140}"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state="$STATE" -f context=gates/verified \
            -f description="$DESCRIPTION" -f target_url="$RUN_URL" --silent
          echo "gates/verified=$STATE on $sha: $DESCRIPTION"
