# CI for this repository (public — GitHub-hosted runners are free here).
name: ci

on:
  pull_request:
  # actionlint and the fixtures are required contexts on main: a queue entry
  # must report them on its own commit.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The local copy of the shared action, so this job exercises the commit
      # under review. sha256 is the linux_amd64 line of
      # actionlint_1.7.12_checksums.txt in the same release.
      - name: Install actionlint (cached, retried, sha256-verified)
        uses: ./.github/actions/install-release-tool
        with:
          name: actionlint
          version: 1.7.12
          url: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      - name: Lint every workflow, including the reusable ones
        # actionlint 1.7.12 does not know the `job.workflow_*` properties GitHub
        # added on 2026-09-03. The upstream fix, rhysd/actionlint#707, is an open,
        # unmerged PR as of 2026-11-09 (`gh pr view 707 -R rhysd/actionlint
        # --json state`). Drop this -ignore once a released actionlint accepts
        # `job.workflow_sha` and ci.yml pins that release.
        run: actionlint -color -shellcheck= -pyflakes= -ignore 'property "workflow_sha" is not defined in object type'

  decide-script:
    name: ci-request decision fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: test/ci-request-decide.test.sh
      - run: test/ci-hint-should-post.test.sh
      - run: test/rulesets.test.sh
      - run: test/gates-verify.test.sh
      - run: test/gates-verify-facts.test.sh
      - run: test/merge-group-target.test.sh
      - run: test/gates-verify-post.test.sh
      - run: test/lean-diff-ok.test.sh
      - run: test/bump-reproduces.test.sh
      - run: test/gate-content-hash.test.sh
      - name: PyYAML for the install-release-tool tests
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --user 'pyyaml==6.0.2'
      - run: test/install-release-tool.test.sh
      - run: test/seed-drift-check.test.sh

  on-demand-guard:
    name: on-demand guard cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --user 'pyyaml==6.0.2'
          python3 test/on-demand-guard.test.py
