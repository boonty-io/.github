# CI for this repository (public — GitHub-hosted runners are free here).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum-verified against the release manifest)
        run: |
          set -euo pipefail
          v=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${v}"
          curl -fsSL -o "actionlint_${v}_linux_amd64.tar.gz" "${base}/actionlint_${v}_linux_amd64.tar.gz"
          curl -fsSL -o checksums.txt "${base}/actionlint_${v}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "actionlint_${v}_linux_amd64.tar.gz" actionlint
      - name: Lint every workflow, including the reusable ones
        run: ./actionlint -color -shellcheck= -pyflakes=

  decide-script:
    name: ci-request decision fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: test/ci-request-decide.test.sh
      - run: test/ci-hint-should-post.test.sh
      - run: test/rulesets.test.sh
      - run: test/gates-verify.test.sh
      - run: test/gates-verify-facts.test.sh
      - run: test/lean-diff-ok.test.sh
      - run: test/gate-content-hash.test.sh

  on-demand-guard:
    name: on-demand guard cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --user 'pyyaml==6.0.2'
          python3 test/on-demand-guard.test.py
