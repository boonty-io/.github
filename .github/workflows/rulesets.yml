# Repository rulesets as code: rulesets/repos/<repo>.json is the desired state
# of each repository's own rulesets (docs/rulesets.md).
#
#   pull_request_target touching them → plan: the PR's files against live,
#                                        in the job summary
#   push to main touching them         → apply: create / update to match
#                                        (never deletes)
#   daily schedule                     → plan: red when live state drifted
#   workflow_dispatch                  → plan, or apply from main only
#
# The App key reaches only code on `main`. A PR is planned with
# pull_request_target: this workflow and scripts/rulesets.sh come from `main`,
# and only the PR's rulesets/repos/*.json is taken from its head, as data that
# jq parses. Its token asks for Administration: read only, which GitHub shows
# no bypass actors, so a PR plan leaves them out (RULESETS_SKIP_BYPASS=1) and
# says so. Every other run is `main`'s own code and asks for write, so the
# scheduled plan also catches a bypass actor edited by hand. The `rulesets`
# environment is restricted to `main` (docs/rulesets.md), so a workflow edited
# on a branch cannot reach the key at all.
#
# Reads and writes go through the `boonty-rulesets` GitHub App (Administration
# read/write on the org's repositories): GITHUB_TOKEN cannot read or change
# another repository's rulesets, and a personal token would tie the change to
# one person's machine. Its key is only exposed to the `rulesets` environment.
name: rulesets

on:
  pull_request_target:
    paths: ['rulesets/repos/**', 'scripts/rulesets.sh', '.github/workflows/rulesets.yml']
  push:
    branches: [main]
    paths: ['rulesets/repos/**', 'scripts/rulesets.sh', '.github/workflows/rulesets.yml']
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: plan (read only) or apply
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read

concurrency:
  group: rulesets-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  rulesets:
    name: rulesets ${{ (github.event_name == 'push' || inputs.mode == 'apply') && 'apply' || 'plan' }}
    # Fork PRs are not planned: they are planned once a branch here carries
    # them. Apply only ever runs from main.
    if: >-
      (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'workflow_dispatch' || inputs.mode != 'apply' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: rulesets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The PR's ruleset files only, as data; nothing from its head runs.
      - name: Take the PR's ruleset files
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          rm -rf rulesets/repos
          git checkout FETCH_HEAD -- rulesets/repos
          find rulesets/repos -mindepth 1 \( ! -type f -o ! -name '*.json' \) -print -delete

      - name: Mint the rulesets App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RULESETS_APP_ID }}
          private-key: ${{ secrets.RULESETS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: ${{ github.event_name == 'pull_request_target' && 'read' || 'write' }}

      - name: Plan or apply
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MODE: ${{ (github.event_name == 'push' || inputs.mode == 'apply') && 'apply' || 'plan' }}
          OWNER: ${{ github.repository_owner }}
          RULESETS_SKIP_BYPASS: ${{ github.event_name == 'pull_request_target' && '1' || '' }}
        run: |
          set -uo pipefail
          rc=0
          scripts/rulesets.sh "$MODE" "$OWNER" rulesets/repos/*.json rulesets/repos/.*.json > out.txt 2>&1 || rc=$?
          cat out.txt
          {
            echo "### rulesets ${MODE}"
            echo '```diff'
            cat out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # plan: 2 = drift. On a PR that is the change under review, not an
          # error; on the schedule it means live rulesets were edited by hand.
          if [ "$rc" -eq 2 ] && [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
            echo "::notice title=rulesets::this PR changes live rulesets; they are applied when it merges"
            exit 0
          fi
          if [ "$rc" -eq 2 ]; then
            echo "::error title=rulesets::live rulesets drifted from rulesets/repos; update the files or re-apply"
          fi
          exit "$rc"
