# Repository rulesets as code: rulesets/repos/<repo>.json is the desired state
# of each repository's own rulesets (docs/rulesets.md).
#
#   pull_request_target touching them → plan: the PR's files against live,
#                                        in the job summary
#   push to main touching them         → apply: create / update to match
#                                        (never deletes)
#   daily schedule                     → plan: red when live state drifted
#   workflow_dispatch                  → plan, or apply from main only
#
# Every plan also compares rulesets/environments/<repo>.json with the live
# deployment environments that guard these keys. Nothing writes them.
#
# Two environments, two GitHub Apps (docs/rulesets.md):
#   rulesets-plan  every plan. `boonty-rulesets-read`, Administration: read.
#                  main only, no reviewer.
#   rulesets       apply only. `boonty-rulesets`, Administration: read/write.
#                  main only, and a required reviewer approves each run.
# So the write key is used only by an apply a reviewer approved. A read-only
# token is shown no bypass actors, so every plan leaves them out
# (RULESETS_SKIP_BYPASS=1) and says so; apply still compares them.
#
# A PR is planned with pull_request_target: this workflow and its scripts come
# from `main`, and only the PR's rulesets/repos/*.json and
# rulesets/environments/*.json are taken from its head, as data that jq
# parses. Both environments are restricted to `main`, so a workflow edited on
# a branch cannot reach either key.
name: rulesets

on:
  pull_request_target:
    paths: ['rulesets/repos/**', 'rulesets/environments/**', 'scripts/rulesets.sh', 'scripts/environments.sh', '.github/workflows/rulesets.yml']
  push:
    branches: [main]
    paths: ['rulesets/repos/**', 'scripts/rulesets.sh', '.github/workflows/rulesets.yml']
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: plan (read only) or apply
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read

# One group per PR, one for applies, one for main's plans: a plan queued
# behind an apply that waits for its reviewer never supersedes it.
concurrency:
  group: rulesets-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || ((github.event_name == 'push' || inputs.mode == 'apply') && 'apply' || 'plan') }}
  cancel-in-progress: false

jobs:
  rulesets:
    name: rulesets ${{ (github.event_name == 'push' || inputs.mode == 'apply') && 'apply' || 'plan' }}
    # Fork PRs are not planned: they are planned once a branch here carries
    # them. Apply only ever runs from main.
    if: >-
      (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'workflow_dispatch' || inputs.mode != 'apply' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same condition as MODE below (environment cannot read env).
    environment: ${{ (github.event_name == 'push' || inputs.mode == 'apply') && 'rulesets' || 'rulesets-plan' }}
    env:
      MODE: ${{ (github.event_name == 'push' || inputs.mode == 'apply') && 'apply' || 'plan' }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The PR's desired-state files only, as data; nothing from its head
      # runs. A head without either directory fails: planning it against
      # main's files would report no change for a PR that deletes them.
      - name: Take the PR's ruleset and environment files
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          for d in rulesets/repos rulesets/environments; do
            if ! git cat-file -e "FETCH_HEAD:$d" 2>/dev/null; then
              echo "::error title=rulesets::this PR's head has no $d; a plan never falls back to main's files (rebase onto main if the branch predates it)"
              exit 1
            fi
            rm -rf "$d"
            git checkout FETCH_HEAD -- "$d"
            find "$d" -mindepth 1 \( ! -type f -o ! -name '*.json' \) -print -delete
          done

      - name: Mint the rulesets App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          # Each environment holds only its own App's secrets.
          app-id: ${{ (github.event_name == 'push' || inputs.mode == 'apply') && secrets.RULESETS_APP_ID || secrets.RULESETS_PLAN_APP_ID }}
          private-key: ${{ (github.event_name == 'push' || inputs.mode == 'apply') && secrets.RULESETS_APP_PRIVATE_KEY || secrets.RULESETS_PLAN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: ${{ (github.event_name == 'push' || inputs.mode == 'apply') && 'write' || 'read' }}

      - name: Plan or apply
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # '0', not '': `cond && '' || '1'` would always be '1'.
          RULESETS_SKIP_BYPASS: ${{ (github.event_name == 'push' || inputs.mode == 'apply') && '0' || '1' }}
        run: |
          set -uo pipefail
          rc=0
          scripts/rulesets.sh "$MODE" "$OWNER" rulesets/repos/*.json rulesets/repos/.*.json > out.txt 2>&1 || rc=$?
          cat out.txt
          {
            echo "### rulesets ${MODE}"
            echo '```diff'
            cat out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # plan: 2 = drift. On a PR that is the change under review, not an
          # error; on the schedule it means live rulesets were edited by hand.
          if [ "$rc" -eq 2 ] && [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
            echo "::notice title=rulesets::this PR changes live rulesets; they are applied when it merges"
            exit 0
          fi
          if [ "$rc" -eq 2 ]; then
            echo "::error title=rulesets::live rulesets drifted from rulesets/repos; update the files or re-apply"
          fi
          exit "$rc"

      # Also after a rulesets drift (that step exits 2), so one drift never
      # hides the other.
      - name: Compare environments
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' && env.MODE == 'plan' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          rc=0
          scripts/environments.sh plan "$OWNER" rulesets/environments/*.json rulesets/environments/.*.json > env.txt 2>&1 || rc=$?
          cat env.txt
          {
            echo "### environments plan"
            echo '```diff'
            cat env.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 2 = drift. Nothing applies environments: an owner changes them in
          # Settings (docs/rulesets.md), then the file must match.
          if [ "$rc" -eq 2 ] && [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
            echo "::notice title=environments::this PR changes environment protection; an owner must make the same change in Settings"
            exit 0
          fi
          if [ "$rc" -eq 2 ]; then
            echo "::error title=environments::live environments drifted from rulesets/environments; an owner must restore them, or update the file"
          fi
          exit "$rc"
